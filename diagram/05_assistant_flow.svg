<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="700" fill="#ffffff"/><text x="48" y="58" font-size="34" font-weight="700" fill="#0f172a">AI Assistant: chat request flow</text><text x="48" y="90" font-size="18" fill="#64748b">Google Gemini behind the backend. The browser never sees the API key</text><rect x="40" y="150" width="260" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="170.0" y="198.0" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">Chat page</text><text x="170.0" y="224.0" font-size="15" fill="#334155" text-anchor="middle">general or movie mode</text><text x="170.0" y="246.0" font-size="15" fill="#334155" text-anchor="middle">no chat saved in browser</text><rect x="350" y="150" width="260" height="120" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="480.0" y="198.0" font-size="20" font-weight="700" fill="#0d9488" text-anchor="middle">POST /api/chat</text><text x="480.0" y="224.0" font-size="15" fill="#334155" text-anchor="middle">input length limit</text><text x="480.0" y="246.0" font-size="15" fill="#334155" text-anchor="middle">per-minute rate limit</text><rect x="660" y="150" width="260" height="120" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="790.0" y="198.0" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">Build prompt</text><text x="790.0" y="224.0" font-size="15" fill="#334155" text-anchor="middle">general: question only</text><text x="790.0" y="246.0" font-size="15" fill="#334155" text-anchor="middle">movie: + stored analysis</text><rect x="970" y="150" width="260" height="120" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1100.0" y="198.0" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">Gemini API</text><text x="1100.0" y="224.0" font-size="15" fill="#334155" text-anchor="middle">one bounded attempt</text><text x="1100.0" y="246.0" font-size="15" fill="#334155" text-anchor="middle">no automatic retry</text><rect x="1280" y="150" width="280" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="1420.0" y="198.0" font-size="20" font-weight="700" fill="#16a34a" text-anchor="middle">Safe reply</text><text x="1420.0" y="224.0" font-size="15" fill="#334155" text-anchor="middle">secrets redacted</text><text x="1420.0" y="246.0" font-size="15" fill="#334155" text-anchor="middle">provider errors → our wording</text><polyline points="300,210 350,210" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="610,210 660,210" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="920,210 970,210" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="1230,210 1280,210" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="660" y="380" width="260" height="110" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="790.0" y="423.0" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">Run store</text><text x="790.0" y="449.0" font-size="15" fill="#334155" text-anchor="middle">GET /movie/{run_id}</text><text x="790.0" y="471.0" font-size="15" fill="#334155" text-anchor="middle">read-only</text><polyline points="790,380 790,270" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="1420,270 1420,330 170,330 170,270" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><text x="1000" y="322" font-size="14" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">answer shown in the page</text><rect x="40" y="540" width="1520" height="100" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="56" y="572" font-size="20" font-weight="700" fill="#e11d48">Guarantees</text><text x="56" y="600" font-size="16" fill="#334155">Key lives only in the backend .env, never returned by an API or logged  ·  assistant explains but never makes or changes a prediction</text></svg>