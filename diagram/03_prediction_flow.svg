<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="720" fill="#ffffff"/><text x="48" y="58" font-size="34" font-weight="700" fill="#0f172a">Prediction request flow</text><text x="48" y="90" font-size="18" fill="#64748b">What happens when a user submits a film on the Predictor page</text><rect x="50" y="120" width="220" height="56" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="160.0" y="158.0" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">User</text><line x1="160" y1="176" x2="160" y2="680" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/><rect x="370" y="120" width="220" height="56" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="480.0" y="158.0" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">React app</text><line x1="480" y1="176" x2="480" y2="680" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/><rect x="690" y="120" width="220" height="56" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="800.0" y="158.0" font-size="20" font-weight="700" fill="#0d9488" text-anchor="middle">FastAPI</text><line x1="800" y1="176" x2="800" y2="680" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/><rect x="1010" y="120" width="220" height="56" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="1120.0" y="158.0" font-size="20" font-weight="700" fill="#d97706" text-anchor="middle">Random Forest</text><line x1="1120" y1="176" x2="1120" y2="680" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/><rect x="1330" y="120" width="220" height="56" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1440.0" y="158.0" font-size="20" font-weight="700"