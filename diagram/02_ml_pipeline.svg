<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="700" fill="#ffffff"/><text x="48" y="58" font-size="34" font-weight="700" fill="#0f172a">Pre-release modelling pipeline</text><text x="48" y="90" font-size="18" fill="#64748b">From the raw IMDb 5000 file to the model the website serves (code in backend/ml, results in docs/PRE_RELEASE_MODEL.md)</text><rect x="40" y="130" width="270" height="130" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="175.0" y="183.0" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">Raw data</text><text x="175.0" y="209.0" font-size="15" fill="#334155" text-anchor="middle">movie_metadata.csv</text><text x="175.0" y="231.0" font-size="15" fill="#334155" text-anchor="middle">5,043 rows</text><rect x="344" y="130" width="270" height="130" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="479.0" y="183.0" font-size="20" font-weight="700" fill="#d97706" text-anchor="middle">Feature audit</text><text x="479.0" y="209.0" font-size="15" fill="#334155" text-anchor="middle">keep only what is known</text><text x="479.0" y="231.0" font-size="15" fill="#334155" text-anchor="middle">before release</text><polyline points="310,195 344,195" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="648" y="130" width="270" height="130" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="783.0" y="183.0" font-size="20" font-weight="700" fill="#0d9488" text-anchor="middle">Clean</text><text x="783.0" y="209.0" font-size="15" fill="#334155" text-anchor="middle">dedupe · fix types</text><text x="783.0" y="231.0" font-size="15" fill="#334155" text-anchor="middle">4,919 films</text><polyline points="614,195 648,195" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="952" y="130" width="270" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1087.0" y="183.0" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">Label</text><text x="1087.0" y="209.0" font-size="15" fill="#334155" text-anchor="middle">imdb_score → Flop / Average / Hit</text><text x="1087.0" y="231.0" font-size="15" fill="#334155" text-anchor="middle">&lt;3 · 3 to &lt;6 · ≥6</text><polyline points="918,195 952,195" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="1256" y="130" width="270" height="130" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="1391.0" y="183.0" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">Stratified split</text><text x="1391.0" y="209.0" font-size="15" fill="#334155" text-anchor="middle">train / held-out test</text><text x="1391.0" y="231.0" font-size="15" fill="#334155" text-anchor="middle">test untouched until the end</text><polyline points="1222,195 1256,195" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="1450,260 1450,320 175,320 175,370" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="40" y="370" width="270" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="175.0" y="411.0" font-size="20" font-weight="700" fill="#d97706" text-anchor="middle">Inputs (9)</text><text x="175.0" y="437.0" font-size="15" fill="#334155" text-anchor="middle">budget · duration · year</text><text x="175.0" y="459.0" font-size="15" fill="#334155" text-anchor="middle">aspect ratio · genres</text><text x="175.0" y="481.0" font-size="15" fill="#334155" text-anchor="middle">country · language</text><text x="175.0" y="503.0" font-size="15" fill="#334155" text-anchor="middle">content rating · colour</text><rect x="344" y="370" width="270" height="150" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="479.0" y="422.0" font-size="20" font-weight="700" fill="#0d9488" text-anchor="middle">Preprocess</text><text x="479.0" y="448.0" font-size="15" fill="#334155" text-anchor="middle">inside the pipeline,</text><text x="479.0" y="470.0" font-size="15" fill="#334155" text-anchor="middle">fitted on train folds only</text><text x="479.0" y="492.0" font-size="15" fill="#334155" text-anchor="middle">oversampling at fit time only</text><rect x="648" y="370" width="270" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="783.0" y="422.0" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">Compare</text><text x="783.0" y="448.0" font-size="15" fill="#334155" text-anchor="middle">14 algorithms</text><text x="783.0" y="470.0" font-size="15" fill="#334155" text-anchor="middle">42 algorithm × imbalance configs</text><text x="783.0" y="492.0" font-size="15" fill="#334155" text-anchor="middle">repeated stratified CV</text><rect x="952" y="370" width="270" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1087.0" y="422.0" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">Select</text><text x="1087.0" y="448.0" font-size="15" fill="#334155" text-anchor="middle">rule fixed before any</text><text x="1087.0" y="470.0" font-size="15" fill="#334155" text-anchor="middle">test number is computed</text><text x="1087.0" y="492.0" font-size="15" fill="#334155" text-anchor="middle">finalists: 14 of 14 within noise</text><rect x="1256" y="370" width="304" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="1408.0" y="433.0" font-size="20" font-weight="700" fill="#16a34a" text-anchor="middle">Random Forest · class weights</text><text x="1408.0" y="459.0" font-size="15" fill="#334155" text-anchor="middle">simplest of the equals</text><text x="1408.0" y="481.0" font-size="15" fill="#334155" text-anchor="middle">300 trees</text><polyline points="310,445 344,445" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="614,445 648,445" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="918,445 952,445" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="1222,445 1256,445" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="40" y="580" width="360" height="80" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="220.0" y="619.5" font-size="20" font-weight="700" fill="#e11d48" text-anchor="middle">Promote</text><text x="220.0" y="644.5" font-size="14" fill="#334155" text-anchor="middle">candidate → live only if tests pass</text><rect x="440" y="580" width="360" height="80" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="620.0" y="619.5" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">Export for the site</text><text x="620.0" y="644.5" font-size="14" fill="#334155" text-anchor="middle">metrics + SHAP explanations</text><rect x="840" y="580" width="360" height="80" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="1020.0" y="619.5" font-size="20" font-weight="700" fill="#16a34a" text-anchor="middle">Saved model</text><text x="1020.0" y="644.5" font-size="14" fill="#334155" text-anchor="middle">pre_release_movie_classifier.joblib</text><polyline points="1408,520 1408,550 1020,550 1020,580" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="840,620 800,620" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="440,620 400,620" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><text x="1240" y="625" font-size="15" fill="#475569" text-anchor="start">Held-out accuracy 74.0% (always-Hit 71.0%)</text></svg>