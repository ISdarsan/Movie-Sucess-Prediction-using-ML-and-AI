<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="900" fill="#ffffff"/><text x="48" y="58" font-size="34" font-weight="700" fill="#0f172a">FRAME system architecture</text><text x="48" y="90" font-size="18" fill="#64748b">React single-page app, FastAPI backend, saved model and data on disk, and three external or local AI services</text><rect x="40" y="120" width="330" height="720" rx="16" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 6"/><text x="58" y="148" font-size="17" font-weight="700" fill="#2563eb">Browser</text><rect x="64" y="160" width="282" height="660" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="80" y="192" font-size="20" font-weight="700" fill="#2563eb">React 19 + TypeScript SPA</text><text x="80" y="220" font-size="15" fill="#334155">Vite · Tailwind 4 · Recharts · Motion</text><text x="80" y="242" font-size="15" fill="#334155"></text><text x="80" y="264" font-size="15" fill="#334155">Pages</text><text x="80" y="286" font-size="15" fill="#334155">Overview</text><text x="80" y="308" font-size="15" fill="#334155">Predictor</text><text x="80" y="330" font-size="15" fill="#334155">Model performance</text><text x="80" y="352" font-size="15" fill="#334155">Explainability</text><text x="80" y="374" font-size="15" fill="#334155">Explore movies</text><text x="80" y="396" font-size="15" fill="#334155">AI Movie Researcher</text><text x="80" y="418" font-size="15" fill="#334155">AI Assistant</text><text x="80" y="440" font-size="15" fill="#334155">Methodology</text><rect x="450" y="120" width="470" height="720" rx="16" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="8 6"/><text x="468" y="148" font-size="17" font-weight="700" fill="#0d9488">FastAPI backend (uvicorn, one origin, /api/*)</text><rect x="474" y="165" width="422" height="150" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="490" y="197" font-size="20" font-weight="700" fill="#0d9488">Core API · backend/app</text><text x="490" y="225" font-size="15" fill="#334155">predict · sensitivity · overview</text><text x="490" y="247" font-size="15" fill="#334155">model-metrics · explain · cohort</text><text x="490" y="269" font-size="15" fill="#334155">movies list / detail / CSV export</text><rect x="474" y="345" width="422" height="170" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="490" y="377" font-size="20" font-weight="700" fill="#7c3aed">Researcher agent · backend/agent</text><text x="490" y="405" font-size="15" fill="#334155">POST /runs → queued run, poll by id</text><text x="490" y="427" font-size="15" fill="#334155">Linear pipeline: predict → analyse →</text><text x="490" y="449" font-size="15" fill="#334155">research → report (template fallback)</text><rect x="474" y="545" width="422" height="130" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="490" y="577" font-size="20" font-weight="700" fill="#7c3aed">Assistant · backend/gemini</text><text x="490" y="605" font-size="15" fill="#334155">POST /api/chat  (general or movie mode)</text><text x="490" y="627" font-size="15" fill="#334155">Rate limit · input limit · key redaction</text><rect x="474" y="705" width="422" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="490" y="737" font-size="20" font-weight="700" fill="#d97706">Startup guard</text><text x="490" y="765" font-size="15" fill="#334155">Model inputs checked against the</text><text x="490" y="787" font-size="15" fill="#334155">feature schema; mismatch → 503 degraded</text><rect x="1000" y="120" width="560" height="330" rx="16" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="8 6"/><text x="1018" y="148" font-size="17" font-weight="700" fill="#475569">On disk (read-only at serve time)</text><rect x="1024" y="160" width="250" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="1149.0" y="203.0" font-size="20" font-weight="700" fill="#d97706" text-anchor="middle">Model</text><text x="1149.0" y="229.0" font-size="15" fill="#334155" text-anchor="middle">pre_release_movie_classifier</text><text x="1149.0" y="251.0" font-size="15" fill="#334155" text-anchor="middle">.joblib (Random Forest)</text><rect x="1290" y="160" width="250" height="110" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1415.0" y="203.0" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">Dataset</text><text x="1415.0" y="229.0" font-size="15" fill="#334155" text-anchor="middle">movie_metadata.csv</text><text x="1415.0" y="251.0" font-size="15" fill="#334155" text-anchor="middle">4,919 films</text><rect x="1024" y="300" width="250" height="120" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1149.0" y="348.0" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">Schema</text><text x="1149.0" y="374.0" font-size="15" fill="#334155" text-anchor="middle">prerelease_schema.json</text><text x="1149.0" y="396.0" font-size="15" fill="#334155" text-anchor="middle">9 allowed inputs</text><rect x="1290" y="300" width="250" height="120" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1415.0" y="348.0" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">Saved metrics</text><text x="1415.0" y="374.0" font-size="15" fill="#334155" text-anchor="middle">model_metrics.json</text><text x="1415.0" y="396.0" font-size="15" fill="#334155" text-anchor="middle">explain.json (SHAP)</text><rect x="1000" y="475" width="560" height="70" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1280.0" y="509.5" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">Wikipedia</text><text x="1280.0" y="534.5" font-size="14" fill="#334155" text-anchor="middle">bounded film context (display only)</text><rect x="1000" y="565" width="560" height="70" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1280.0" y="599.5" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">Ollama (local LLM)</text><text x="1280.0" y="624.5" font-size="14" fill="#334155" text-anchor="middle">writes the report prose from the evidence</text><rect x="1000" y="655" width="560" height="70" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="1280.0" y="689.5" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">SQLite run store</text><text x="1280.0" y="714.5" font-size="14" fill="#334155" text-anchor="middle">agent runs, traces and analyses</text><rect x="1000" y="745" width="560" height="75" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1280.0" y="782.0" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">Google Gemini API</text><text x="1280.0" y="807.0" font-size="14" fill="#334155" text-anchor="middle">chat answers; the key stays on the server</text><polyline points="346,240 474,240" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><text x="410" y="228" font-size="14" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">/api</text><polyline points="346,430 474,430" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="346,610 474,610" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="896,240 1000,240" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><text x="948" y="228" font-size="14" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">reads</text><polyline points="896,390 1000,510" fill="none" stroke="#475569" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="950" y="430" font-size="14" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">research</text><polyline points="896,440 1000,600" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><text x="925" y="515" font-size="14" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">report</text><polyline points="896,490 1000,690" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><text x="935" y="620" font-size="14" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">saves runs</text><polyline points="896,640 1000,782" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><text x="930" y="725" font-size="14" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">chat</text><text x="48" y="880" font-size="14" fill="#475569" text-anchor="start">Only POST /api/predict and /api/sensitivity compute and return a result without storing it. There is no login and no user database.</text></svg>