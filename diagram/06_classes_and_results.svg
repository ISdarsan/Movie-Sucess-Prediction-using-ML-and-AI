<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="700" fill="#ffffff"/><text x="48" y="58" font-size="34" font-weight="700" fill="#0f172a">Classes and headline results</text><text x="48" y="90" font-size="18" fill="#64748b">Labels come from the IMDb score; the model uses only information known before release</text><rect x="40" y="130" width="450" height="120" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="265.0" y="181.0" font-size="26" font-weight="700" fill="#e11d48" text-anchor="middle">Flop</text><text x="265.0" y="207.0" font-size="15" fill="#334155" text-anchor="middle">imdb_score &lt; 3</text><text x="265.0" y="229.0" font-size="15" fill="#334155" text-anchor="middle">rare: 41 films in the study</text><rect x="575" y="130" width="450" height="120" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="800.0" y="192.0" font-size="26" font-weight="700" fill="#d97706" text-anchor="middle">Average</text><text x="800.0" y="218.0" font-size="15" fill="#334155" text-anchor="middle">3 ≤ imdb_score &lt; 6</text><rect x="1110" y="130" width="450" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="1335.0" y="181.0" font-size="26" font-weight="700" fill="#16a34a" text-anchor="middle">Hit</text><text x="1335.0" y="207.0" font-size="15" fill="#334155" text-anchor="middle">imdb_score ≥ 6</text><text x="1335.0" y="229.0" font-size="15" fill="#334155" text-anchor="middle">the majority class</text><rect x="40" y="320" width="362" height="200" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="221" y="365" font-size="18" fill="#16a34a" text-anchor="middle">Held-out accuracy</text><text x="221" y="445" font-size="58" font-weight="700" fill="#16a34a" text-anchor="middle">74.0%</text><text x="221" y="490" font-size="15" fill="#475569" text-anchor="middle">always answering Hit: 71.0%</text><rect x="426" y="320" width="362" height="200" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="607" y="365" font-size="18" fill="#2563eb" text-anchor="middle">Balanced accuracy</text><text x="607" y="445" font-size="58" font-weight="700" fill="#2563eb" text-anchor="middle">53.1%</text><text x="607" y="490" font-size="15" fill="#475569" text-anchor="middle">chance: 33.3%</text><rect x="812" y="320" width="362" height="200" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="993" y="365" font-size="18" fill="#7c3aed" text-anchor="middle">Macro F1</text><text x="993" y="445" font-size="58" font-weight="700" fill="#7c3aed" text-anchor="middle">0.516</text><text x="993" y="490" font-size="15" fill="#475569" text-anchor="middle">three classes</text><rect x="1198" y="320" width="362" height="200" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="1379" y="365" font-size="18" fill="#e11d48" text-anchor="middle">Flops found</text><text x="1379" y="445" font-size="58" font-weight="700" fill="#e11d48" text-anchor="middle">1 of 8</text><text x="1379" y="490" font-size="15" fill="#475569" text-anchor="middle">too few Flops for a reliable figure</text><text x="48" y="590" font-size="16" fill="#475569" text-anchor="start">On later films (train ≤ 2009, test ≥ 2010): accuracy 68.0% vs 65.6% for the majority class.</text><text x="48" y="620" font-size="16" fill="#475569" text-anchor="start">The finalists are statistically indistinguishable, so the simplest was chosen. Figures from docs/PRE_RELEASE_MODEL.md.</text></svg>