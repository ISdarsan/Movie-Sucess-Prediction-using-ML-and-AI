<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1600" height="760" fill="#ffffff"/><text x="48" y="58" font-size="34" font-weight="700" fill="#0f172a">AI Movie Researcher: run lifecycle</text><text x="48" y="90" font-size="18" fill="#64748b">A fixed pipeline controlled by code. The language model only writes prose from evidence; it never changes a prediction</text><rect x="40" y="130" width="250" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="165.0" y="173.0" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">Submit film</text><text x="165.0" y="199.0" font-size="15" fill="#334155" text-anchor="middle">POST /runs · idempotency key</text><text x="165.0" y="221.0" font-size="15" fill="#334155" text-anchor="middle">returns 202 + run id</text><rect x="340" y="130" width="250" height="110" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="465.0" y="173.0" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">Queue</text><text x="465.0" y="199.0" font-size="15" fill="#334155" text-anchor="middle">one worker, one local LLM</text><text x="465.0" y="221.0" font-size="15" fill="#334155" text-anchor="middle">SQLite run store</text><polyline points="290,185 340,185" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="40" y="300" width="1520" height="300" rx="16" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 6"/><text x="58" y="586" font-size="17" font-weight="700" fill="#7c3aed">Pipeline (each step is timed; a failure degrades the result instead of crashing the run)</text><rect x="70" y="360" width="260" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="200.0" y="423.0" font-size="20" font-weight="700" fill="#d97706" text-anchor="middle">1 Predict</text><text x="200.0" y="449.0" font-size="15" fill="#334155" text-anchor="middle">existing /predict route</text><text x="200.0" y="471.0" font-size="15" fill="#334155" text-anchor="middle">Random Forest scores</text><rect x="364" y="360" width="260" height="150" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/><text x="494.0" y="423.0" font-size="20" font-weight="700" fill="#0d9488" text-anchor="middle">2 Analyse</text><text x="494.0" y="449.0" font-size="15" fill="#334155" text-anchor="middle">whitelisted read-only tools</text><text x="494.0" y="471.0" font-size="15" fill="#334155" text-anchor="middle">comparables · risks · facts</text><polyline points="330,435 364,435" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="658" y="360" width="260" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="788.0" y="423.0" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">3 Research</text><text x="788.0" y="449.0" font-size="15" fill="#334155" text-anchor="middle">bounded Wikipedia context</text><text x="788.0" y="471.0" font-size="15" fill="#334155" text-anchor="middle">display only</text><polyline points="624,435 658,435" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="952" y="360" width="260" height="150" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1082.0" y="423.0" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">4 Report</text><text x="1082.0" y="449.0" font-size="15" fill="#334155" text-anchor="middle">local LLM writes from evidence</text><text x="1082.0" y="471.0" font-size="15" fill="#334155" text-anchor="middle">verified, else template</text><polyline points="918,435 952,435" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="1246" y="360" width="260" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text x="1376.0" y="423.0" font-size="20" font-weight="700" fill="#16a34a" text-anchor="middle">5 Save</text><text x="1376.0" y="449.0" font-size="15" fill="#334155" text-anchor="middle">result + trace stored</text><text x="1376.0" y="471.0" font-size="15" fill="#334155" text-anchor="middle">status: done</text><polyline points="1212,435 1246,435" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="590,185 680,185 680,280 200,280 200,360" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><rect x="40" y="650" width="360" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="220.0" y="689.5" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">Poll</text><text x="220.0" y="714.5" font-size="14" fill="#334155" text-anchor="middle">GET /runs/{id} until done</text><rect x="440" y="650" width="360" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="620.0" y="689.5" font-size="20" font-weight="700" fill="#2563eb" text-anchor="middle">Researcher page</text><text x="620.0" y="714.5" font-size="14" fill="#334155" text-anchor="middle">analysis, risks, trace</text><rect x="840" y="650" width="360" height="80" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="1020.0" y="689.5" font-size="20" font-weight="700" fill="#7c3aed" text-anchor="middle">Assistant (movie mode)</text><text x="1020.0" y="714.5" font-size="14" fill="#334155" text-anchor="middle">explains the stored analysis</text><polyline points="400,690 440,690" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="800,690 840,690" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><polyline points="1330,510 1330,625 220,625 220,650" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#a)"/><text x="775" y="618" font-size="14" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="5">result</text><text x="1230" y="695" font-size="14" fill="#475569" text-anchor="start">Tools are call-capped and argument-validated</text></svg>